# ---- UPDATE_SCHEME DYNAMICS ----
# regtest-sccs-lpb-6 -- UPDATE_SCHEME DYNAMICS (electron-number dynamics, one SCF per ionic step)
# Al111_gce_dynamics.inp: 12-atom Al slab, MD NVE 6 steps, POTENTIOSTAT_PERIOD 20 fs, chain length 2.
# Reference: total energy of MD step 6; tol 1.0E-4 as in regtest-sccs-lpb-3 (metallic grand-canonical SCF scatters by about 1E-4 Ha between builds).
"Al111_gce_dynamics.inp" = [{matcher="E_total", tol=1.0E-4, ref=-24.685606259968200}]
# Al111_gce_dyn_noperiod_abort.inp, Al111_gce_dyn_energy_abort.inp, Al111_gce_dyn_chain_abort.inp and
# Al111_gce_dyn_scfstep_abort.inp MUST ABORT with the message named in their first comment line; not listed.
# Former keyword names (aliases); same energy as Al111_gce_fixq_mode2.inp.
"Al111_gce_fixq_mode2_legacy_names.inp" = [{matcher="E_total", tol=1.0E-4, ref=-24.709661529329239}]
# Default PHI_SHE (4.600 eV): target work function 0.5 + 4.600 eV; reference from the first run (gcc 11.4).
"Al111_gce_rks_default_phi.inp" = [{matcher="E_total", tol=1.0E-4, ref=-24.638323309962583}]
